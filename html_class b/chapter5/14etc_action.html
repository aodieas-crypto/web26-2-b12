<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">


    <title>반응 /상태 /구조 선택자 </title>
    <style>
        h1:hover {
            color: red;
        }

        h1:active {
            color:
                blue;
        }

        /* input태그가 사용 가능할떄 background-color 속성에 wheat색을 적용
        input:enabled {
            background-color: wheat;
        }
         /* input태그가  불가일때는 gray색을 적용

        input:disabled {
            background-color: gray;
        }
         /* input태그가 포커스 되었을때는 orange색을 적용*/

        input:focus {
            background-color: orange;
        }
    </style>

</head>

<body>
    <h1>반응 선택자</h1>
    <h1>상태 선택자</h1>
    <h1>구조 선택자</h1>
    <h2> 사용가능 </h2>
    <input>
    <h2>사용불가</h2>
    <input disabled="disabled">



</body>

</html>
