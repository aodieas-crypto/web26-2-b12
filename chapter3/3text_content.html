    <h1>홍차<h1>
<hr><!--구분선-->

    <h2>정의<h2>
        <p>홍차(紅茶, Black Tea)는 차나무(Camellia sinensis)의 찻잎을 시들리기, 비비기, 산화(발효), 건조 등의 과정을 거쳐 완전 발효(산화)시킨 차와 그 우린 음료를 말합니다</p>
<br><!--줄바꿈-->
    <h3>등급<h3>
        <p>홍차 등급은 절대적인 맛의 순위가 아니라 찻잎의 형태, 크기, 그리고 채취한 부위에 따라 나눈 분류 기준입니다.</p>
