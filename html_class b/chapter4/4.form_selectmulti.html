<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">


    <title>4form_selectmulti</title>


</head>

<body>
    <h2>선택 가능한 입력 양식 </h2>
    <select>
        <option>김밥</option>
        <option>라면</option>
        <option>떡볶이</option>
        <option>순대</option>
    </select>

    <h2>여러개 선택 가능한 입력 양식 </h2>
    <select multiple="multiple">
        <option>김밥</option>
        <option>라면</option>
        <option>떡볶이</option>
        <option>순대</option>
    </select>
    < h2>선택 옵션 묶기</h2>
        <select>
            <optgroup label="html5">
                <option>multi</option>
                <option>connec</option>
                <option>device</option>
            </optgroup>
            <optgroup label="css3">
                <option>animation</option>
                <option>transform</option>
            </optgroup>
        </select>

</body>

</html>
