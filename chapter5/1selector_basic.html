<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">


    <title>css3 Selector Basic</title>
    <style>
        /* *{color: red;}*/
        /*h1  { color: orange;}*/
        p {
            color: brown;
        }

        #header {
            width: 800px;
            margin: 0 auto;
            background: red;
        }

        #wrap {
            width: 800px;
            margin: 0 auto;
            overflow: hidden;
        }

        #aside {
            width: 200px;
            float: left;
            background: blue;
        }

        #content {
            width: 600px;
            float: left;
            background: green;
        }

        #rint {
            color: purple;
        }

        .select {
            color: violet;
        }

        .item {
            color: red;
        }

        .header {
            background-color: blue;
        }

        li.select {
            color: blueviolet;
        }
    </style>

</head>

<body>
    <h2>1.전체 선택자</h2>
    <h2>2.태그선택자</h2>
    <h2>3.아이디선택자</h2>
    <h2 class="item header">4.클래스선택자</h2>
    <hr>
    <ul>
        <li class="select">사과 </li>
        <li>바나나 </li>
        <li>오렌지 </li> 1
        <li class="select">감 </li>
    </ul>




    <h1> 제목글자</h1>
    <p>lorem ipsum dolor sit amet </p>
    <p> consectetur adipiscing elit.</p>

    <hr>
    <div id="header">
        <h1>#header태그</h1>
    </div>
    <div id="wrap">
        <div id="aside">
            <h1>#aside태그</h1>
        </div>
        <div id="content">
            <h1>#content태그</h1>
        </div>
    </div>


</body>

</html>
